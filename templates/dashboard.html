<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supervision Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="bg-dark text-light">
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Supervision Dashboard</span>
        <div>
          <button id="export-csv" class="btn btn-outline-success btn-sm me-2">Exporter CSV</button>
          <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Se déconnecter</button>
        </div>
      </div>
    </nav>

    <div class="container-fluid p-4">
      <div class="row mb-4">
        <div class="col-md-6">
          <div class="card bg-secondary">
            <div class="card-header text-light">CPU Utilisation</div>
            <div class="card-body">
              <canvas id="overviewCPUChart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card bg-secondary">
            <div class="card-header text-light">Température</div>
            <div class="card-body">
              <canvas id="overviewTempChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <h4 class="text-light mb-3">Machines</h4>
      <div id="machinesList" class="row g-3">
        <!-- Les machines seront chargées via JavaScript -->
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
