<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Supervision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-dark text-light d-flex align-items-center justify-content-center" style="height:100vh;">
    <div class="card p-4 bg-secondary text-light" style="width:360px;">
      <h4 class="card-title mb-3 text-center">Se connecter</h4>
      <div id="loginError"></div>
      <form id="loginForm">
        <div class="mb-2">
          <label class="form-label">Nom d'utilisateur</label>
          <input class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
      </form>
      <div class="mt-3 text-muted small text-center">Compte demo : <strong>admin / louvre</strong></div>
    </div>

    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;
          
          try {
              const response = await fetch('/api/login', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ username, password })
              });
              
              const data = await response.json();
              
              if (data.success) {
                  // Redirection vers le dashboard
                  window.location.href = data.redirect;
              } else {
                  document.getElementById('loginError').innerHTML = 
                      `<div class="alert alert-danger">${data.message}</div>`;
              }
          } catch (error) {
              console.error('Erreur login:', error);
              document.getElementById('loginError').innerHTML = 
                  '<div class="alert alert-danger">Erreur serveur</div>';
          }
      });
    </script>
  </body>
</html>
